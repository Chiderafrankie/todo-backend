version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_create_todos.sql:/docker-entrypoint-initdb.d/001_create_todos.sql

  app:
    build: .
    ports:
      - "4040:4040"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/todo_db
      NODE_ENV: development
      PORT: 4040
    depends_on:
      - db